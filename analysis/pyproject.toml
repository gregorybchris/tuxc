[project]
authors = [
    { name = "Chris Gregory", email = "christopher.b.gregory@gmail.com" },
]
dependencies = ["click>=8.2.0", "pydantic>=2.12.0", "rich>=14.0.0"]
description = "Athlete-run home of Tufts cross country."
keywords = ["gpx", "running", "tuxc"]
license = "MIT"
name = "tuxc"
readme = "../README.md"
requires-python = ">=3.14"
version = "0.1.0"

[project.scripts]
tuxc = "tuxc.cli:main"

[dependency-groups]
dev = ["pytest>=9.1.1", "ruff>=0.16.0", "ty>=0.0.63"]

[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[tool.hatch.build.targets.wheel]
packages = ["src/tuxc"]

[project.urls]
repository = "https://github.com/gregorybchris/tuxc"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
log_cli = true
log_cli_level = "INFO"

[tool.ty.environment]
python-version = "3.14"

[tool.ruff]
line-length = 120
src = ["src"]

[tool.ruff.lint]
ignore = ["D100", "D104", "FIX002", "TD002", "TD003"]
select = [
    "A",
    "ARG",
    "B",
    "BLE",
    "C4",
    "E",
    "EM",
    "ERA",
    "F",
    "FIX",
    "G",
    "I",
    "ICN",
    "ISC",
    "LOG",
    "N",
    "PL",
    "PT",
    "PTH",
    "PLR",
    "RET",
    "RUF",
    "S",
    "SIM",
    "SLF",
    "T20",
    "TC",
    "TD",
    "TID",
    "W",
]

[tool.ruff.lint.extend-per-file-ignores]
"**/*.py" = ["A001", "A002", "PLR0912", "PLR0915", "PLR0913", "T201", "T203"]
"src/tuxc/cli.py" = ["TC003"]
# The alternative is defusedxml, and route files are ones we put in the repo ourselves.
"src/tuxc/gpx.py" = ["S314"]
"tests/**/*.py" = ["PLR2004", "S101"]

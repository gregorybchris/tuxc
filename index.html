<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#3172AE" />
    <title>tuxc</title>
    <script>
      // Runs before anything paints, so a reader who has chosen dark — or whose
      // system has — never gets a white page first. The same decision is made
      // again in src/lib/hooks/theme.ts once React is up; this is only here to
      // beat the first frame.
      (function () {
        try {
          var stored = window.localStorage.getItem("tuxc-theme");
          var dark =
            stored === "dark" ||
            (stored !== "light" &&
              window.matchMedia("(prefers-color-scheme: dark)").matches);
          document.documentElement.classList.toggle("dark", dark);
          // Tells the browser which way to paint scrollbars and form controls.
          document.documentElement.style.colorScheme = dark ? "dark" : "light";
          document
            .querySelector('meta[name="theme-color"]')
            .setAttribute("content", dark ? "#214B73" : "#3172AE");
        } catch (error) {
          // Private browsing can refuse localStorage. Light is the fallback.
        }
      })();
    </script>
    <meta
      name="description"
      content="Athlete-run home of Tufts cross country."
    />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="tuxc" />
    <meta
      name="twitter:description"
      content="Athlete-run home of Tufts cross country."
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script
      data-goatcounter="https://tuxc.goatcounter.com/count"
      async
      src="//gc.zgo.at/count.js"
    ></script>
  </body>
</html>

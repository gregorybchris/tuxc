name: Analysis CI

# ruff, ty, and pytest via uv.

concurrency:
  group: analysis-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - analysis/**
      - gpx/**
      - .github/workflows/analysis-ci.yaml
  pull_request:
    branches:
      - main
    paths:
      - analysis/**
      - gpx/**
      - .github/workflows/analysis-ci.yaml

jobs:
  analysis-ci:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version:
          - "3.14"

    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Python ${{ matrix.python-version }} setup
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Setup uv
        uses: astral-sh/setup-uv@v6
        with:
          version: 0.8.17
          enable-cache: true
          cache-local-path: ~/.cache/uv
          cache-dependency-glob: analysis/uv.lock

      - name: Install package
        id: install
        working-directory: analysis
        run: uv sync --dev

      - name: Run ruff
        shell: bash
        working-directory: analysis
        run: |
          uv run ruff check .
          uv run ruff format . --check
        if: (success() || failure()) && steps.install.outcome == 'success'

      - name: Run ty
        shell: bash
        working-directory: analysis
        run: |
          uv run ty check
        if: (success() || failure()) && steps.install.outcome == 'success'

      - name: Run pytest
        shell: bash
        working-directory: analysis
        run: |
          uv run pytest tests --log-cli-level=INFO
        if: (success() || failure()) && steps.install.outcome == 'success'
